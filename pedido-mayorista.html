<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANONIMAS — Pedido Mayorista</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --accent:#DA4D3A;
  --accent-dark:#B93E2E;
  --ink:#161616;
  --paper:#FFFFFF;
  --sand:#F6F2ED;
  --line:#E4DDD3;
  --muted:#8A8378;
  --ok:#3D7A4D;
  --font-display:'Archivo',sans-serif;
  --font-body:'Work Sans',sans-serif;
  --radius:2px;
  --tray-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tray-h) + 12px);
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:.02em;}
button{font-family:var(--font-body);cursor:pointer;border:none;background:none;}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
.upper{text-transform:uppercase;letter-spacing:.08em;}

/* ============================================================
   HEADER
   ============================================================ */
.site-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 24px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--paper);z-index:40;
}
.logo{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:.12em;}
.logo small{display:block;font-family:var(--font-body);font-weight:500;font-size:10px;letter-spacing:.2em;color:var(--muted);margin-top:1px;}
.header-actions{display:flex;align-items:center;gap:14px;}
.icon-btn{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;}
.icon-btn:hover{border-color:var(--ink);}
.badge{
  position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;
  font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}

/* ============================================================
   ACCESS GATE
   ============================================================ */
.gate{
  position:fixed;inset:0;background:var(--ink);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.gate[hidden]{display:none;}
.gate-card{max-width:360px;width:100%;color:#fff;text-align:center;}
.gate-card .logo{color:#fff;font-size:26px;margin-bottom:6px;}
.gate-card p{color:#C9C4BB;font-size:14px;line-height:1.5;margin:14px 0 22px;}
.gate-form{display:flex;flex-direction:column;gap:12px;}
.gate-form input{
  background:transparent;border:1px solid #444;color:#fff;padding:14px 16px;
  font-size:16px;text-align:center;letter-spacing:.15em;border-radius:var(--radius);
  text-transform:uppercase;
}
.gate-form input::placeholder{color:#666;letter-spacing:.05em;}
.btn-primary{
  background:var(--accent);color:#fff;padding:14px 20px;font-weight:700;
  font-size:13px;border-radius:var(--radius);transition:background .15s;
}
.btn-primary:hover{background:var(--accent-dark);}
.gate-error{color:var(--accent);font-size:12px;min-height:16px;}
.gate-help{margin-top:18px;font-size:12px;color:#666;}
.gate-help a{color:#999;}

/* ============================================================
   FILTER BAR
   ============================================================ */
.filter-bar{
  padding:16px 24px;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:12px;background:var(--paper);
  position:sticky;top:75px;z-index:30;
}
.tabs{display:flex;gap:8px;flex-wrap:wrap;}
.tab{
  padding:8px 14px;border:1px solid var(--line);border-radius:20px;
  font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;
}
.tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.filter-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.select-wrap{position:relative;}
.select-wrap select{
  appearance:none;border:1px solid var(--line);padding:8px 30px 8px 12px;
  font-size:12px;border-radius:var(--radius);background:var(--paper);color:var(--ink);
  text-transform:uppercase;letter-spacing:.04em;font-weight:600;
}
.select-wrap::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:9px;pointer-events:none;color:var(--muted);}
.search-wrap{flex:1;min-width:140px;position:relative;}
.search-wrap input{
  width:100%;border:1px solid var(--line);padding:8px 12px;font-size:13px;
  border-radius:var(--radius);
}
.result-count{font-size:11px;color:var(--muted);letter-spacing:.04em;}

/* ============================================================
   GRID
   ============================================================ */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:1px;background:var(--line);border-top:1px solid var(--line);
}
.card{background:var(--paper);padding:0;display:flex;flex-direction:column;text-align:left;position:relative;}
.card-img{
  aspect-ratio:3/4;background:var(--sand);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.card-img .mono{font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:.1em;color:var(--line);text-align:center;padding:10px;text-transform:uppercase;}
.card-img .mono span{display:block;font-size:9px;color:var(--muted);font-weight:600;margin-top:6px;letter-spacing:.15em;}
.tag-collection{
  position:absolute;top:8px;left:8px;background:var(--paper);padding:3px 7px;
  font-size:9px;font-weight:700;letter-spacing:.08em;border-radius:2px;color:var(--ink);
}
.tag-nostock{
  position:absolute;top:8px;right:8px;background:var(--ink);color:#fff;padding:3px 7px;
  font-size:9px;font-weight:700;letter-spacing:.05em;border-radius:2px;
}
.card-body{padding:12px;flex:1;display:flex;flex-direction:column;gap:4px;}
.card-cat{font-size:9px;color:var(--muted);letter-spacing:.1em;font-weight:600;}
.card-name{font-family:var(--font-display);font-size:13px;font-weight:700;line-height:1.25;}
.card-price{font-size:13px;font-weight:600;margin-top:auto;padding-top:6px;}
.card-price.consult{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.empty-state{padding:80px 24px;text-align:center;color:var(--muted);}
.empty-state h3{color:var(--ink);margin-bottom:6px;font-size:15px;}

/* ============================================================
   MODAL — product detail
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(22,22,22,.55);z-index:150;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal-overlay[hidden]{display:none;}
.modal{
  background:var(--paper);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  border-radius:14px 14px 0 0;position:relative;
}
@media(min-width:640px){
  .modal-overlay{align-items:center;}
  .modal{border-radius:8px;max-height:88vh;}
}
.modal-close{
  position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
  background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;font-size:16px;z-index:5;
}
.modal-img{aspect-ratio:4/5;background:var(--sand);display:flex;align-items:center;justify-content:center;}
.modal-img .mono{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:.1em;color:var(--line);text-align:center;text-transform:uppercase;}
.modal-img .mono span{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:8px;letter-spacing:.15em;}
.modal-body{padding:22px 22px 28px;}
.modal-cat{font-size:10px;color:var(--muted);letter-spacing:.12em;font-weight:700;}
.modal-name{font-size:20px;margin:4px 0 8px;}
.modal-price{font-size:19px;font-weight:700;color:var(--ink);}
.modal-price.consult{color:var(--accent);font-size:14px;text-transform:uppercase;letter-spacing:.04em;}
.modal-price-menor{font-size:12px;color:var(--muted);margin-top:2px;}
.modal-desc{font-size:13px;line-height:1.55;color:#4a453d;margin:14px 0;}
.field-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 8px;color:var(--ink);}
.swatches{display:flex;flex-wrap:wrap;gap:8px;}
.swatch{
  padding:8px 13px;border:1px solid var(--line);border-radius:20px;font-size:12px;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase;
}
.swatch.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.swatch:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed;}
.stock-hint{font-size:11px;margin-top:8px;font-weight:600;}
.stock-hint.low{color:var(--accent);}
.stock-hint.out{color:var(--muted);}
.qty-row{display:flex;align-items:center;gap:14px;margin-top:18px;}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius);}
.stepper button{width:38px;height:40px;font-size:16px;font-weight:600;}
.stepper span{width:36px;text-align:center;font-weight:700;font-size:14px;}
.modal-add{
  width:100%;margin-top:20px;background:var(--accent);color:#fff;padding:15px;
  font-weight:700;font-size:13px;letter-spacing:.05em;border-radius:var(--radius);
  text-transform:uppercase;transition:background .15s;
}
.modal-add:hover{background:var(--accent-dark);}
.modal-add:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;}
.talle-guide-link{display:inline-block;margin-top:10px;font-size:11px;color:var(--muted);text-decoration:underline;}

/* ============================================================
   ORDER TRAY (signature element — order docket)
   ============================================================ */
.tray-bar{
  position:fixed;left:0;right:0;bottom:0;height:var(--tray-h);background:var(--ink);color:#fff;
  z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  transition:transform .2s;
}
.tray-bar[hidden]{transform:translateY(100%);display:flex;}
.tray-bar-info{display:flex;flex-direction:column;}
.tray-bar-info b{font-size:13px;letter-spacing:.03em;}
.tray-bar-info span{font-size:10px;color:#9c968b;letter-spacing:.05em;}
.tray-open-btn{background:var(--accent);color:#fff;padding:10px 18px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}

.tray-panel{
  position:fixed;inset:0;z-index:180;background:rgba(22,22,22,.55);display:flex;
  align-items:flex-end;justify-content:center;
}
.tray-panel[hidden]{display:none;}
.tray-sheet{
  background:var(--paper);width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;
  border-radius:14px 14px 0 0;
}
@media(min-width:640px){.tray-panel{align-items:center;} .tray-sheet{border-radius:8px;max-height:85vh;}}
.tray-header{
  padding:20px 22px 14px;border-bottom:1px dashed var(--line);display:flex;
  align-items:center;justify-content:space-between;
}
.tray-header h2{font-size:16px;}
.tray-items{flex:1;overflow-y:auto;padding:6px 22px;}
.tray-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.tray-item-thumb{
  width:48px;height:60px;background:var(--sand);border-radius:2px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
  font-weight:800;font-size:9px;color:var(--line);text-align:center;
}
.tray-item-info{flex:1;min-width:0;}
.tray-item-info b{font-size:12.5px;display:block;}
.tray-item-info span{font-size:11px;color:var(--muted);display:block;margin-top:1px;}
.tray-item-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.tray-item-price{font-size:12px;font-weight:700;}
.tray-item-actions{display:flex;align-items:center;gap:6px;}
.tray-item-actions button{width:24px;height:24px;border:1px solid var(--line);border-radius:4px;font-size:13px;}
.tray-item-remove{font-size:10px;color:var(--muted);text-decoration:underline;margin-top:2px;}
.tray-empty{padding:60px 24px;text-align:center;color:var(--muted);font-size:13px;}
.tray-footer{padding:16px 22px 22px;border-top:1px solid var(--line);}
.client-field{width:100%;border:1px solid var(--line);padding:11px 13px;font-size:13px;border-radius:var(--radius);margin-bottom:14px;}
.tray-total-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:var(--muted);}
.tray-total-row.main{color:var(--ink);font-weight:700;font-size:15px;margin-bottom:14px;}
.btn-whatsapp{
  width:100%;background:#25D366;color:#fff;padding:15px;border-radius:var(--radius);
  font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-whatsapp:disabled{background:var(--line);color:var(--muted);}
.tray-clear{display:block;margin:12px auto 0;font-size:11px;color:var(--muted);text-decoration:underline;}

/* toast */
.toast{
  position:fixed;bottom:calc(var(--tray-h) + 16px);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;font-size:12.5px;font-weight:600;
  z-index:250;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

footer{padding:40px 24px 30px;text-align:center;color:var(--muted);font-size:11px;letter-spacing:.03em;}
</style>
</head>

/* ============================================================
   STATE (persisted in localStorage)
   ============================================================ */
/* ============================================================
   STORAGE — defensive wrapper. Some contexts (sandboxed previews,
   private browsing, file:// in some browsers) throw on localStorage
   access; falling back to an in-memory store keeps the site working
   (just without persistence) instead of silently breaking all the
   script that runs after it.
   ============================================================ */
const memoryStore = {};
function storageGet(key){
  try { return localStorage.getItem(key); } catch(e){ return (key in memoryStore) ? memoryStore[key] : null; }
}
function storageSet(key, val){
  try { localStorage.setItem(key, val); } catch(e){ memoryStore[key] = val; }
}

let order = JSON.parse(storageGet('anonimas_order') || '[]');
let activeCollection = 'ALL';
let activeCategory = '';
let searchTerm = '';

function saveOrder(){ storageSet('anonimas_order', JSON.stringify(order)); renderTray(); }

/* ============================================================
   UTILS
   ============================================================ */
function money(n){
  if(n === null || n === undefined) return null;
  return '$' + n.toLocaleString('es-AR');
}
function initials(name){
  return name.split(' ').slice(0,2).map(w=>w[0]).join('');
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function placeholderBlock(name, big){
  return `<div class="mono">${initials(name)}<span>${big?'FOTO PRÓXIMAMENTE':'S/ FOTO'}</span></div>`;
}

/* ============================================================
   ACCESS GATE
   ============================================================ */
const gate = document.getElementById('gate');
if(storageGet('anonimas_access') === 'granted'){ gate.hidden = true; }
document.getElementById('gateForm').addEventListener('submit', function(e){
  e.preventDefault();
  const val = document.getElementById('gateInput').value.trim().toUpperCase();
  if(val === ACCESS_CODE){
    storageSet('anonimas_access','granted');
    gate.hidden = true;
  } else {
    document.getElementById('gateError').textContent = 'Código incorrecto. Probá de nuevo.';
  }
});

/* ============================================================
   FILTER BAR SETUP
   ============================================================ */
const collections = ['ALL', ...new Set(PRODUCTS.map(p=>p.collection))];
const collectionLabels = {ALL:'Todo', 'INVIERNO 26':'Invierno 26', 'VERANO 2027':'Verano 2027'};
const tabsEl = document.getElementById('collectionTabs');
collections.forEach(c=>{
  const b = document.createElement('button');
  b.className = 'tab' + (c==='ALL' ? ' active':'');
  b.textContent = collectionLabels[c] || c;
  b.dataset.value = c;
  b.addEventListener('click', ()=>{
    activeCollection = c;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    b.classList.add('active');
    render();
  });
  tabsEl.appendChild(b);
});

const categories = [...new Set(PRODUCTS.map(p=>p.category))].sort();
const catSelect = document.getElementById('categoryFilter');
categories.forEach(c=>{
  const o = document.createElement('option');
  o.value = c; o.textContent = c;
  catSelect.appendChild(o);
});
catSelect.addEventListener('change', ()=>{ activeCategory = catSelect.value; render(); });
document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

/* ============================================================
   GRID RENDER
   ============================================================ */
function filteredProducts(){
  return PRODUCTS.filter(p=>{
    if(activeCollection !== 'ALL' && p.collection !== activeCollection) return false;
    if(activeCategory && p.category !== activeCategory) return false;
    if(searchTerm && !p.name.toLowerCase().includes(searchTerm)) return false;
    return true;
  });
}
function productTotalStock(p){
  if(p.collection !== 'INVIERNO 26') return null; // unknown stock -> no badge
  return p.variants.reduce((s,v)=> s + (v.stock||0), 0);
}
function render(){
  const list = filteredProducts();
  document.getElementById('resultCount').textContent = list.length + ' producto' + (list.length===1?'':'s');
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if(list.length === 0){
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>No encontramos productos</h3><p>Probá con otro filtro o búsqueda.</p></div>';
    return;
  }
  list.forEach(p=>{
    const card = document.createElement('button');
    card.className = 'card';
    const stock = productTotalStock(p);
    const priceHtml = p.priceMayor
      ? `<div class="card-price">${money(p.priceMayor)}</div>`
      : `<div class="card-price consult">Consultar precio</div>`;
    card.innerHTML = `
      <div class="card-img">
        <span class="tag-collection">${collectionLabels[p.collection]||p.collection}</span>
        ${stock === 0 ? '<span class="tag-nostock">Sin stock</span>' : ''}
        ${placeholderBlock(p.name)}
      </div>
      <div class="card-body">
        <div class="card-cat">${p.category}</div>
        <div class="card-name">${p.name}</div>
        ${priceHtml}
      </div>`;
    card.addEventListener('click', ()=> openProduct(p.id));
    grid.appendChild(card);
  });
}

/* ============================================================
   PRODUCT MODAL
   ============================================================ */
let currentProduct = null;
let currentColor = null;
let currentTalle = null;
let currentQty = 1;

function variantsForColor(p, color){
  return p.variants.filter(v=>v.color === color);
}
function availableColors(p){
  return [...new Set(p.variants.map(v=>v.color).filter(Boolean))];
}
function availableTalles(p, color){
  const t = p.variants.filter(v=>v.color===color).map(v=>v.talle).filter(Boolean);
  return [...new Set(t)].sort((a,b)=>(TALLE_ORDER[a]||9)-(TALLE_ORDER[b]||9));
}
function variantStock(p, color, talle){
  const v = p.variants.find(v=>v.color===color && v.talle===talle);
  return v ? v.stock : null;
}
function variantPrice(p, color, talle){
  const v = p.variants.find(v=>v.color===color && v.talle===talle);
  if(v && v.priceMayor) return v.priceMayor;
  return p.priceMayor;
}

function openProduct(id){
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  currentProduct = p;
  currentColor = availableColors(p)[0] || null;
  const talles = availableTalles(p, currentColor);
  currentTalle = talles[0] || null;
  currentQty = 1;
  renderModal();
  document.getElementById('productModal').hidden = false;
}
function renderModal(){
  const p = currentProduct;
  const colors = availableColors(p);
  const talles = availableTalles(p, currentColor);
  const stock = currentTalle ? variantStock(p, currentColor, currentTalle) : null;
  const price = variantPrice(p, currentColor, currentTalle);
  const showMenor = p.priceMenor && price === p.priceMayor;

  let stockHtml = '';
  if(stock === 0) stockHtml = '<div class="stock-hint out">Sin stock disponible en este color/talle.</div>';
  else if(stock !== null && stock <= 2) stockHtml = `<div class="stock-hint low">¡Últimas unidades! (${stock})</div>`;

  document.getElementById('modalContent').innerHTML = `
    <div class="modal-img">${placeholderBlock(p.name, true)}</div>
    <div class="modal-body">
      <div class="modal-cat">${p.category} · ${collectionLabels[p.collection]||p.collection}</div>
      <h3 class="modal-name">${p.name}</h3>
      ${price ? `<div class="modal-price">${money(price)}</div>` : `<div class="modal-price consult">Consultar precio</div>`}
      ${showMenor ? `<div class="modal-price-menor">PVP sugerido: ${money(p.priceMenor)}</div>` : ''}
      ${p.description ? `<p class="modal-desc">${p.description}</p>` : ''}

      ${colors.length ? `
      <div class="field-label">Color</div>
      <div class="swatches" id="colorSwatches">
        ${colors.map(c=>`<button class="swatch ${c===currentColor?'active':''}" data-color="${c}">${c}</button>`).join('')}
      </div>` : ''}

      ${talles.length ? `
      <div class="field-label">Talle</div>
      <div class="swatches" id="talleSwatches">
        ${talles.map(t=>{
          const st = variantStock(p, currentColor, t);
          const disabled = st === 0;
          return `<button class="swatch ${t===currentTalle?'active':''}" data-talle="${t}" ${disabled?'disabled':''}>${t}</button>`;
        }).join('')}
      </div>` : ''}

      ${stockHtml}

      <div class="qty-row">
        <div class="field-label" style="margin:0;">Cantidad</div>
        <div class="stepper">
          <button id="qtyMinus">−</button>
          <span id="qtyVal">${currentQty}</span>
          <button id="qtyPlus">+</button>
        </div>
      </div>

      <button class="modal-add" id="addToOrderBtn" ${stock===0?'disabled':''}>
        ${stock===0 ? 'Sin stock' : 'Agregar a mi pedido'}
      </button>
      <a class="talle-guide-link" href="https://mayoristas.anonimasargentina.com/productos/${p.id}/" target="_blank">Ver ficha completa en la tienda →</a>
    </div>
  `;

  document.querySelectorAll('#colorSwatches .swatch').forEach(b=>{
    b.addEventListener('click', ()=>{
      currentColor = b.dataset.color;
      const t = availableTalles(p, currentColor);
      currentTalle = t[0] || null;
      currentQty = 1;
      renderModal();
    });
  });
  document.querySelectorAll('#talleSwatches .swatch').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.disabled) return;
      currentTalle = b.dataset.talle;
      renderModal();
    });
  });
  const qtyValEl = document.getElementById('qtyVal');
  document.getElementById('qtyMinus').addEventListener('click', ()=>{
    if(currentQty>1){ currentQty--; qtyValEl.textContent = currentQty; }
  });
  document.getElementById('qtyPlus').addEventListener('click', ()=>{
    currentQty++; qtyValEl.textContent = currentQty;
  });
  const addBtn = document.getElementById('addToOrderBtn');
  if(addBtn) addBtn.addEventListener('click', addCurrentToOrder);
}

function addCurrentToOrder(){
  const p = currentProduct;
  const price = variantPrice(p, currentColor, currentTalle);
  const key = [p.id, currentColor, currentTalle].join('|');
  const existing = order.find(o=>o.key===key);
  if(existing){
    existing.qty += currentQty;
  } else {
    order.push({
      key, productId:p.id, name:p.name, color:currentColor, talle:currentTalle,
      qty:currentQty, price: price, collection:p.collection
    });
  }
  saveOrder();
  showToast(`Agregado: ${p.name}${currentColor?' · '+currentColor:''}${currentTalle?' · '+currentTalle:''}`);
  document.getElementById('productModal').hidden = true;
}

document.getElementById('closeModal').addEventListener('click', ()=>{
  document.getElementById('productModal').hidden = true;
});
document.getElementById('productModal').addEventListener('click', (e)=>{
  if(e.target.id === 'productModal') document.getElementById('productModal').hidden = true;
});

/* ============================================================
   ORDER TRAY
   ============================================================ */
function orderTotals(){
  let units = 0, total = 0, unpriced = 0;
  order.forEach(o=>{
    units += o.qty;
    if(o.price){ total += o.price * o.qty; } else { unpriced += o.qty; }
  });
  return {units, total, unpriced};
}
function renderTray(){
  const {units, total, unpriced} = orderTotals();
  const trayBar = document.getElementById('trayBar');
  const badge = document.getElementById('trayBadge');
  if(units === 0){
    trayBar.hidden = true;
    badge.hidden = true;
  } else {
    trayBar.hidden = false;
    badge.hidden = false;
    badge.textContent = units;
    document.getElementById('trayBarCount').textContent = units + ' producto' + (units===1?'':'s');
    document.getElementById('trayBarTotal').textContent = 'Total estimado ' + money(total) + (unpriced?` (+${unpriced} a consultar)`:'');
  }

  const itemsEl = document.getElementById('trayItems');
  if(order.length === 0){
    itemsEl.innerHTML = '<div class="tray-empty">Todavía no agregaste productos.<br>Explorá el catálogo y armá tu pedido.</div>';
  } else {
    itemsEl.innerHTML = order.map(o=>`
      <div class="tray-item">
        <div class="tray-item-thumb">${initials(o.name)}</div>
        <div class="tray-item-info">
          <b>${o.name}</b>
          <span>${[o.color,o.talle].filter(Boolean).join(' · ') || 'Talle único'}</span>
          <span>${o.price ? money(o.price)+' c/u' : 'Consultar precio'}</span>
        </div>
        <div class="tray-item-right">
          <div class="tray-item-price">${o.price ? money(o.price*o.qty) : '—'}</div>
          <div class="tray-item-actions">
            <button data-act="minus" data-key="${o.key}">−</button>
            <span>${o.qty}</span>
            <button data-act="plus" data-key="${o.key}">+</button>
          </div>
          <button class="tray-item-remove" data-act="remove" data-key="${o.key}">Quitar</button>
        </div>
      </div>
    `).join('');
    itemsEl.querySelectorAll('button[data-act]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const key = b.dataset.key;
        const item = order.find(o=>o.key===key);
        if(!item) return;
        if(b.dataset.act === 'plus') item.qty++;
        if(b.dataset.act === 'minus'){ item.qty--; if(item.qty<=0){ order = order.filter(o=>o.key!==key); } }
        if(b.dataset.act === 'remove'){ order = order.filter(o=>o.key!==key); }
        saveOrder();
      });
    });
  }

  const footerEl = document.getElementById('trayFooter');
  if(order.length === 0){
    footerEl.innerHTML = '';
  } else {
    footerEl.innerHTML = `
      <input type="text" class="client-field" id="clientName" placeholder="Tu nombre o el de tu local (opcional)" value="${storageGet('anonimas_client')||''}">
      <div class="tray-total-row"><span>Unidades</span><span>${units}</span></div>
      ${unpriced ? `<div class="tray-total-row"><span>A consultar</span><span>${unpriced} unid.</span></div>` : ''}
      <div class="tray-total-row main"><span>Total estimado</span><span>${money(total)}</span></div>
      <button class="btn-whatsapp" id="sendWhatsapp">📲 Enviar pedido por WhatsApp</button>
      <button class="tray-clear" id="clearOrder">Vaciar pedido</button>
    `;
    document.getElementById('clientName').addEventListener('input', (e)=>{
      storageSet('anonimas_client', e.target.value);
    });
    document.getElementById('sendWhatsapp').addEventListener('click', sendOrderViaWhatsapp);
    document.getElementById('clearOrder').addEventListener('click', ()=>{
      if(confirm('¿Vaciar todo el pedido?')){ order = []; saveOrder(); }
    });
  }
}

function sendOrderViaWhatsapp(){
  const {total, unpriced} = orderTotals();
  const client = (document.getElementById('clientName').value || '').trim();
  let lines = [];
  lines.push('PEDIDO MAYORISTA - ANONIMAS');
  if(client) lines.push('Cliente: ' + client);
  lines.push('');
  const byCollection = {};
  order.forEach(o=>{
    byCollection[o.collection] = byCollection[o.collection] || [];
    byCollection[o.collection].push(o);
  });
  Object.keys(byCollection).forEach(col=>{
    lines.push('— ' + (collectionLabels[col]||col).toUpperCase() + ' —');
    byCollection[col].forEach(o=>{
      const desc = [o.color, o.talle].filter(Boolean).join(' / ') || 'Talle único';
      const priceTxt = o.price ? money(o.price) + ' c/u' : 'a consultar';
      lines.push(`• ${o.name} (${desc}) x${o.qty} — ${priceTxt}`);
    });
    lines.push('');
  });
  lines.push(`Total estimado: ${money(total)}` + (unpriced ? ` (+${unpriced} unid. a consultar)` : ''));
  lines.push('');
  lines.push('Envío este pedido para coordinar pago y envío.');

  const text = encodeURIComponent(lines.join('\n'));
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${text}`, '_blank');
}

document.getElementById('openTrayBtn').addEventListener('click', ()=> document.getElementById('trayPanel').hidden = false);
document.getElementById('trayOpenBtn2').addEventListener('click', ()=> document.getElementById('trayPanel').hidden = false);
document.getElementById('closeTray').addEventListener('click', ()=> document.getElementById('trayPanel').hidden = true);
document.getElementById('trayPanel').addEventListener('click', (e)=>{
  if(e.target.id === 'trayPanel') document.getElementById('trayPanel').hidden = true;
});

/* ============================================================
   INIT
   ============================================================ */
render();
renderTray();
</script>
</body>
</html>
